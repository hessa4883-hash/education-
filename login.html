<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل / دخول - منصتي</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>منصتي</div>
      </div>

      <nav class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="dashboard.html">لوحة التحكم</a>
      </nav>

      <a class="btn" href="index.html">رجوع</a>
    </div>
  </header>

  <main class="form-wrap container">
    <div class="card form">
      <h2>تسجيل الدخول</h2>
      <p class="desc">هذه واجهة فقط: أدخلي اسمك وسيتم نقلك للوحة التحكم.</p>

      <form id="loginForm">
        <div class="field">
          <label for="name">الاسم</label>
          <input id="name" name="name" type="text" placeholder="مثال: سارة" autocomplete="name" />
        </div>

        <div class="field">
          <label for="email">البريد (اختياري)</label>
          <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">كلمة المرور (اختياري)</label>
          <input id="password" name="password" type="password" placeholder="••••••••" />
        </div>

        <button class="btn btn-primary" type="submit" style="width:100%;">ادخل إلى منصتي</button>

        <div class="helper">
          *لا يوجد تسجيل حقيقي حاليًا لأن هذا قالب Front-end. نقدر نضيف Backend لاحقًا.
        </div>

        <div id="toast" class="toast"></div>
      </form>

      <div class="hr"></div>
      <p class="helper" style="margin:0;">
        ليس لديك حساب؟ (واجهة) — سيمكنك ربطها لاحقًا بصفحة “إنشاء حساب”.
      </p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
